name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TEST_THREADS: 2
  SSPUR_SMT_TIMEOUT: 5000
  SSPUR_FILL_MS: 5000

jobs:
  test:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-15
          - name: Linux x86_64
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install tools (macOS)
        if: runner.os == 'macOS'
        run: brew install z3

      - name: Install tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld llvm z3 tzdata libcurl4-openssl-dev

      - name: Toolchain versions
        run: |
          rustc --version
          clang --version
          z3 --version

      - name: Build
        run: cargo build --release

      - name: Version
        run: ./target/release/sspur --version

      - name: Clippy
        run: cargo clippy --release --all-targets -- -D warnings

      - name: Test
        env:
          SSPUR_STRICT_NATIVE: "1"
        run: cargo test --release --no-fail-fast

      - name: Generated program fuzz (interpreter vs native)
        run: ./target/release/sspur fuzz --gen 200 --seed 2026 --cases 6 --group 50 --modes O2,O3 --keep "$RUNNER_TEMP/fuzz-gen"

      - name: Upload fuzz findings
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-gen-${{ matrix.os }}
          path: ${{ runner.temp }}/fuzz-gen
          if-no-files-found: ignore

      - name: Corpus differential check
        env:
          SSPUR_BIN: ${{ github.workspace }}/target/release/sspur
          SSPUR_STRICT_NATIVE: "1"
        run: python3 tools/corpus_diff.py

      - name: Pulse tests (offline fixtures)
        env:
          SSPUR_STRICT_NATIVE: "1"
        run: pulse/test.sh

  windows:
    name: Windows x86_64
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      RUST_BACKTRACE: "1"
      Z3_VERSION: 4.8.12
    steps:
      - name: Keep LF line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install tools (LLVM, z3)
        run: |
          llvm="C:/Program Files/LLVM/bin"
          if [ ! -x "$llvm/clang.exe" ]; then choco install llvm -y --no-progress; fi
          echo "$llvm" >> "$GITHUB_PATH"
          z3="z3-${Z3_VERSION}-x64-win"
          if curl -fsSL -o "$RUNNER_TEMP/z3.zip" "https://github.com/Z3Prover/z3/releases/download/z3-${Z3_VERSION}/${z3}.zip"; then
            unzip -q "$RUNNER_TEMP/z3.zip" -d "$RUNNER_TEMP"
            echo "$RUNNER_TEMP/$z3/bin" >> "$GITHUB_PATH"
          else
            echo "::warning::z3 download failed; z3-backed tests will skip"
          fi
          echo "SSPUR_CACHE=$RUNNER_TEMP/sspur-cache" >> "$GITHUB_ENV"
          python -m pip install --quiet tzdata
          echo "TZDIR=$(python -c 'import os, tzdata; print(os.path.join(os.path.dirname(tzdata.__file__), "zoneinfo"))')" >> "$GITHUB_ENV"

      - name: Toolchain versions
        run: |
          rustc --version
          clang --version
          clang -print-resource-dir
          find "$(clang -print-resource-dir)/lib" -name "clang_rt.builtins*" || echo "no clang_rt.builtins found"
          z3 --version || echo "z3 not installed"
          ld.lld --version || echo "ld.lld not found"

      - name: Build
        run: cargo build --release

      - name: Version
        run: ./target/release/sspur.exe --version

      - name: Native smoke test
        shell: pwsh
        run: |
          foreach ($t in "core", "concurrency", "std_system") {
            ./target/release/sspur.exe test --interp tests/programs/$t.ssp
            "interp $t exit 0x{0:X8}" -f $LASTEXITCODE
            ./target/release/sspur.exe test --strict-native tests/programs/$t.ssp
            $c = $LASTEXITCODE
            "native $t exit 0x{0:X8}" -f $c
            if ($c -ne 0) { exit 1 }
          }

      - name: Clippy
        run: cargo clippy --release --all-targets -- -D warnings

      - name: Test
        env:
          SSPUR_STRICT_NATIVE: "1"
        run: cargo test --release --no-fail-fast

      - name: Corpus differential check
        env:
          SSPUR_BIN: ${{ github.workspace }}/target/release/sspur.exe
          SSPUR_STRICT_NATIVE: "1"
          PYTHONUTF8: "1"
        run: python tools/corpus_diff.py

      - name: Upload native build cache
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sspur-cache-windows
          path: ${{ runner.temp }}/sspur-cache
          if-no-files-found: ignore

  site:
    name: Docs site and tutorial snippets
    runs-on: ubuntu-24.04
    env:
      MDBOOK_VERSION: 0.5.4
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld llvm z3 tzdata libcurl4-openssl-dev
          mkdir -p "$RUNNER_TEMP/mdbook"
          curl -fsSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar -xz -C "$RUNNER_TEMP/mdbook"
          echo "$RUNNER_TEMP/mdbook" >> "$GITHUB_PATH"
          v="$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')"
          curl -fsSL "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${v}/wasm-bindgen-${v}-x86_64-unknown-linux-musl.tar.gz" | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/wasm-bindgen-${v}-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"

      - name: Tutorial snippets (every transcript under docs/snippets)
        env:
          SSPUR_STRICT_NATIVE: "1"
        run: cargo test --release -p sspur-cli --test tutorial

      - name: Highlighter syntax
        run: node --check docs/assets/sspur-highlight.js

      - name: Clippy for the wasm build
        run: cargo clippy --release -p sspur-wasm --target wasm32-unknown-unknown -- -D warnings

      - name: Playground API (wasm build, compared with sspur run --interp)
        env:
          SSPUR_BIN: ${{ github.workspace }}/target/release/sspur
        run: |
          tools/build_playground.sh --no-editor "$RUNNER_TEMP/play"
          node tools/playground_test.mjs "$RUNNER_TEMP/play"

      - name: Build the site
        run: mdbook build docs

      - name: Check internal links
        run: python3 tools/check_site_links.py docs/book
