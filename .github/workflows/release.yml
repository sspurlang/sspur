name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-apple-darwin
            os: macos-15
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Check the tag matches the crate version
        shell: bash
        run: |
          want="${GITHUB_REF_NAME#v}"
          have="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          if [ "$want" != "$have" ]; then
            echo "tag $GITHUB_REF_NAME does not match workspace version $have" >&2
            exit 1
          fi

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p sspur-cli

      - name: Smoke test
        if: matrix.target != 'x86_64-apple-darwin' && matrix.target != 'aarch64-pc-windows-msvc'
        shell: bash
        run: ./target/${{ matrix.target }}/release/sspur --version

      - name: Package
        shell: bash
        run: |
          name="sspur-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp README.md CHANGELOG.md LICENSE-MIT LICENSE-APACHE NOTICE "dist/$name/"
          if [ "$RUNNER_OS" = Windows ]; then
            cp "target/${{ matrix.target }}/release/sspur.exe" "dist/$name/"
            archive="$name.zip"
            (cd dist && 7z a -tzip -bso0 "$archive" "$name")
          else
            cp "target/${{ matrix.target }}/release/sspur" "dist/$name/"
            archive="$name.tar.gz"
            tar -C dist -czf "dist/$archive" "$name"
          fi
          cd dist
          if command -v sha256sum >/dev/null; then sha256sum "$archive"; else shasum -a 256 "$archive"; fi | sed 's/ \*/  /' > "$archive.sha256"
          cat "$archive.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: sspur-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums, Homebrew formula and Scoop manifest
        run: |
          cd dist
          cat ./*.sha256 | sort -k2 > SHA256SUMS
          sha256sum -c SHA256SUMS
          cd ..
          packaging/homebrew/render.sh "${GITHUB_REF_NAME#v}" dist/SHA256SUMS > dist/sspur.rb
          cat dist/sspur.rb
          packaging/scoop/render.sh "${GITHUB_REF_NAME#v}" dist/SHA256SUMS > dist/sspur.json
          cat dist/sspur.json

      - name: VS Code extension, JetBrains template and Zed extension
        run: |
          v="${GITHUB_REF_NAME#v}"
          cd packaging/vscode
          npm ci --no-audit --no-fund
          npm version "$v" --no-git-tag-version --allow-same-version
          npx --yes @vscode/vsce@3 package -o "../../dist/sspur-${GITHUB_REF_NAME}.vsix"
          cd ../jetbrains
          zip -qr "../../dist/sspur-lsp4ij-${GITHUB_REF_NAME}.zip" sspur
          cd ../..
          packaging/zed/package.sh "$RUNNER_TEMP/zed/sspur-zed" https://github.com/utkarshavardhana/sspur "$GITHUB_SHA" "$v"
          (cd "$RUNNER_TEMP/zed" && zip -qr "$GITHUB_WORKSPACE/dist/sspur-zed-${GITHUB_REF_NAME}.zip" sspur-zed)
          cd dist
          sha256sum "sspur-${GITHUB_REF_NAME}.vsix" "sspur-lsp4ij-${GITHUB_REF_NAME}.zip" "sspur-zed-${GITHUB_REF_NAME}.zip" >> SHA256SUMS
          sha256sum -c SHA256SUMS

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Browser checker for the package registry's Publish page
        run: |
          v="$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')"
          curl -fsSL "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${v}/wasm-bindgen-${v}-x86_64-unknown-linux-musl.tar.gz" | tar -xz -C "$RUNNER_TEMP"
          export PATH="$RUNNER_TEMP/wasm-bindgen-${v}-x86_64-unknown-linux-musl:$PATH"
          curl -fsSL "https://github.com/WebAssembly/binaryen/releases/download/version_123/binaryen-version_123-x86_64-linux.tar.gz" | tar -xz -C "$RUNNER_TEMP"
          export PATH="$RUNNER_TEMP/binaryen-version_123/bin:$PATH"
          tools/build_registry_checker.sh "$RUNNER_TEMP/registry-web/checker"
          tar -C "$RUNNER_TEMP/registry-web" -czf "dist/sspur-registry-web-${GITHUB_REF_NAME}.tar.gz" checker
          (cd dist && sha256sum "sspur-registry-web-${GITHUB_REF_NAME}.tar.gz" >> SHA256SUMS && sha256sum -c SHA256SUMS)

      - name: Release notes
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md." > notes.md

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "SSPUR ${GITHUB_REF_NAME}" --notes-file notes.md \
            dist/*.tar.gz dist/*.zip dist/*.vsix dist/SHA256SUMS dist/sspur.rb dist/sspur.json install.sh install.ps1
