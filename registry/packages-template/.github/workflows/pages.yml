name: Pages

# Builds the package site with the SSPUR programs in tools/site and deploys it to GitHub Pages.
# The publish workflow starts it after each merge; it also runs on pushes and by hand.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install sspur
        run: tools/install-sspur.sh
      - name: The browser checker for the Publish page
        run: |
          v="$(tr -d '[:space:]' < .sspur-version)"
          mkdir -p "$RUNNER_TEMP/checker"
          if curl -fsSL --retry 3 -o "$RUNNER_TEMP/checker.tar.gz" "https://github.com/utkarshavardhana/sspur/releases/download/v$v/sspur-registry-web-v$v.tar.gz"; then
            tar -xzf "$RUNNER_TEMP/checker.tar.gz" -C "$RUNNER_TEMP/checker"
          else
            echo "no browser checker in the sspur $v release; the Publish page runs without pre-checks"
          fi
      - name: Build the site
        env:
          WORK: ${{ runner.temp }}/site
        run: |
          tools/ci.sh site "$RUNNER_TEMP/out"
          if [ -d "$RUNNER_TEMP/checker/checker" ]; then cp -R "$RUNNER_TEMP/checker/checker" "$RUNNER_TEMP/out/publish/"; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/out

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
