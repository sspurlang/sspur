[package]
name = "sspur-eval"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["native"]
native = ["sspur-native/jit", "dep:libloading"]

[dependencies]
sspur-syntax.workspace = true
sspur-native = { path = "../sspur-native", default-features = false }
sspur-check.workspace = true
libloading = { version = "0.9.0", optional = true }

[target.'cfg(target_family = "wasm")'.dependencies]
libm = "0.2"
wasm-bindgen = "0.2"
