[package]
name = "sspur-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Compiler, interpreter and agent tooling for SSPUR, a programming language for AI agents"
readme = "../../README.md"
keywords = ["language", "compiler", "agents", "effects", "contracts"]
categories = ["compilers", "command-line-utilities"]

[[bin]]
name = "sspur"
path = "src/main.rs"

[dependencies]
sspur-syntax.workspace = true
sspur-check.workspace = true
sspur-hash.workspace = true
sspur-eval.workspace = true
sspur-store.workspace = true
sspur-native.workspace = true
sspur-smt.workspace = true
sspur-deploy.workspace = true
sspur-ide = { workspace = true, optional = true }
sspur-registry.workspace = true
serde_json.workspace = true
blake3.workspace = true
lsp-server = { version = "0.10", optional = true }
crossbeam-channel = { version = "0.5", optional = true }

[features]
default = ["lsp"]
# `sspur lsp`, the language server.
lsp = ["dep:lsp-server", "dep:crossbeam-channel", "dep:sspur-ide"]
