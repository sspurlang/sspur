[book]
title = "SSPUR"
description = "A programming language for AI agents to write, read, and maintain."
authors = ["Utkarsha Vardhana"]
language = "en"
src = "."

[build]
build-dir = "book"
create-missing = false

[output.html]
site-url = "/sspur/"
git-repository-url = "https://github.com/sspurlang/sspur"
additional-js = ["assets/sspur-highlight.js", "assets/sspur-play.js"]
additional-css = ["assets/sspur.css"]
default-theme = "light"
preferred-dark-theme = "navy"
no-section-label = true

[output.html.search]
enable = true
limit-results = 20
use-boolean-and = true
boost-title = 2

[output.html.print]
enable = false
